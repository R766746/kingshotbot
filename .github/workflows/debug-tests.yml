name: Debug tests

# TEMPORARY: surface pytest failures as check-run annotations (readable
# via the API even when the default token is read-only). Remove once CI
# is green.

on:
  push:
    branches: [arena/01a089a0-kingshotbot]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (surface failures as annotations)
        run: |
          set +e
          pytest -q --tb=short > pytest-output.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest-output.txt | head -8 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | head -c 380)
              echo "::error::PYTEST $msg"
            done
            tail -30 pytest-output.txt | grep -E "^(E|>|[A-Za-z_.]+Error|assert|short test summary|[0-9]+ (failed|passed|error))" | head -12 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | head -c 380)
              echo "::error::OUT $msg"
            done
          else
            echo "::notice::PYTEST ALL PASSED"
          fi
          exit 0
