name: Debug tests

# TEMPORARY: post pytest output to PR #1 so it can be read via the API.
# Remove once CI is green.

on:
  push:
    branches: [arena/01a089a0-kingshotbot]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (capture output)
        id: tests
        run: |
          set -o pipefail
          pytest -q --tb=long 2>&1 | tee pytest-output.txt
        continue-on-error: true
      - name: Diagnostics
        if: always()
        run: |
          {
            echo "## runner diagnostics"
            echo '```'
            python - <<'PY'
            import sys, cv2, numpy, PIL, PIL.ImageFont, platform
            print("python:", sys.version)
            print("platform:", platform.platform())
            print("cv2:", cv2.__version__, "numpy:", numpy.__version__, "PIL:", PIL.__version__)
            import os
            p = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
            print("dejavu font exists:", os.path.exists(p))
            try:
                f = PIL.ImageFont.load_default()
                print("load_default ok:", type(f).__name__)
            except Exception as e:
                print("load_default FAILED:", e)
            PY
            echo '```'
          } >> pytest-output.txt
      - name: Comment output on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(head -c 60000 pytest-output.txt)
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body "### Debug test output (run $GITHUB_RUN_NUMBER)

          \`\`\`
          ${BODY}
          \`\`\`" || true
