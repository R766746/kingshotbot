name: Debug tests

# TEMPORARY: post pytest output to PR #1 so it can be read via the API.
# Remove once CI is green.

on:
  push:
    branches: [arena/01a089a0-kingshotbot]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Diagnostics
        run: |
          python -c "import sys, platform; print('python:', sys.version); print('platform:', platform.platform())"
          python -c "import cv2, numpy, PIL; print('cv2:', cv2.__version__, '| numpy:', numpy.__version__, '| PIL:', PIL.__version__)"
          python -c "import os; p='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'; print('dejavu exists:', os.path.exists(p))"
          python -c "from PIL import ImageFont; f=ImageFont.load_default(); print('load_default:', type(f).__name__)"
          python -m pip list | grep -Ei "opencv|numpy|pillow|pytest"
      - name: Run tests (capture output)
        run: |
          set +e
          pytest -q --tb=long > pytest-output.txt 2>&1
          code=$?
          echo "PYTEST_EXIT_CODE=$code" >> pytest-output.txt
          cat pytest-output.txt
          exit 0
      - name: Comment output on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          body = open('pytest-output.txt', errors='replace').read()[:55000]
          md = '### Debug test output (run ${{ github.run_number }})\n\n\`\`\`\n' + body + '\n\`\`\`\n'
          open('comment.md', 'w').write(md)
          "
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file comment.md
